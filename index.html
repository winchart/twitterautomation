<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টুইটার অটোমেশন প্যানেল</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 700px; background: white; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-box { margin-bottom: 20px; font-weight: bold; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        textarea { width: 45%; height: 100px; margin: 5px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>টুইটার অটোমেশন সিস্টেম</h2>
    
    <div class="status-box">
        সিস্টেম স্ট্যাটাস: <span id="status-dot" class="status-dot" style="background: orange;"></span><span id="status-text">সংযোগ চেক হচ্ছে...</span>
    </div>

    <div>
        <textarea id="usernames" placeholder="ইউজারনেমসমূহ (প্রতি লাইনে একটি)"></textarea>
        <textarea id="passwords" placeholder="পাসওয়ার্ডসমূহ (প্রতি লাইনে একটি)"></textarea>
    </div>

    <button onclick="startLogin()">লগইন করে প্রোফাইল তৈরি করুন</button>
</div>

<script>
    const BACKEND_URL = "http://78.154.103.48:9768"; // আপনার উইস্পবাইট আইপি ও পোর্ট
    const MASTER_KEY = "MY_TWITTER_SECRET_MASTER_KEY_2026";

    async function checkServerStatus() {
        const dot = document.getElementById("status-dot");
        const text = document.getElementById("status-text");

        try {
            const response = await fetch(BACKEND_URL + "/", {
                method: "GET",
                headers: {
                    "X-Master-Key": MASTER_KEY
                }
            });

            if (response.ok) {
                dot.style.background = "green";
                text.innerText = "সংযুক্ত";
            } else {
                dot.style.background = "red";
                text.innerText = "সংযোগ বিচ্ছিন্ন (অথরাইজেশন ফেল)";
            }
        } catch (error) {
            dot.style.background = "red";
            text.innerText = "সংযোগ বিচ্ছিন্ন";
            console.error("Connection error:", error);
        }
    }

    async function startLogin() {
        const usernames = document.getElementById("usernames").value.split("\n").filter(u => u.trim() !== "");
        const passwords = document.getElementById("passwords").value.split("\n").filter(p => p.trim() !== "");

        if (usernames.length === 0 || passwords.length === 0) {
            alert("দয়া করে ইউজারনেম এবং পাসওয়ার্ড দিন!");
            return;
        }

        try {
            let response = await fetch(BACKEND_URL + "/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify({ usernames, passwords })
            });

            let result = await response.json();
            alert(result.message || "সফলভাবে প্রসেস হয়েছে!");
        } catch (err) {
            alert("সার্ভারে রিকোয়েস্ট পাঠানো যায়নি!");
            console.error(err);
        }
    }

    // পেজ লোড হওয়ার সাথে সাথে স্ট্যাটাস চেক করবে
    window.onload = checkServerStatus;
</script>

</body>
</html>
